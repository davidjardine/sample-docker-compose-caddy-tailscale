name: {$APP_NAME}
services:
  tailscale:
    container_name: {$APP_NAME}-ts
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=tailscale-auth-key
      - TS_STATE_DIR=/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    volumes:
      - ts-data:/var/lib/tailscale
      - sock-vol:/tmp
  caddy:
    container_name: {$APP_NAME}-caddy
    image: caddy/caddy:latest
    network_mode: service:tailscale
    cap_add:
      - net_admin
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:{$CADDY_SITE_DIR}
      - caddy-data:/data
      - caddy-config:/config
      - sock-vol:/var/run/tailscale
volumes:
  sock-vol:
  ts-data:
  caddy-data:
  caddy-config: